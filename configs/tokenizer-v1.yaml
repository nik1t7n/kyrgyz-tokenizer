version: tokenizer-v1

paths:
  train_glob: data/processed/corpus-v1/train-*.txt.zst
  validation_glob: data/processed/corpus-v1/validation-*.txt.zst
  working_dir: artifacts/tokenizer-v1
  evaluation_dir: data/evaluation/tokenizer-v1
  release_dir: models/kyrgyz-byte-bpe-v1

training:
  vocab_sizes: [8192, 16384, 32768, 50000]
  min_frequency: 2
  iterator_batch_size: 1000
  max_token_length: 64

evaluation:
  embedding_dimensions: [768, 2048, 4096]
  word_pattern: "[\\p{L}\\p{M}]+(?:[-'][\\p{L}\\p{M}]+)*"

external_datasets:
  ud_ktmu:
    kind: conllu
    url: https://raw.githubusercontent.com/UniversalDependencies/UD_Kyrgyz-KTMU/46aad7546a3797df9f9ccf8c1c23019eab66dbd2/ky_ktmu-ud-test.conllu
    revision: 46aad7546a3797df9f9ccf8c1c23019eab66dbd2
    license: CC-BY-SA-4.0
  ud_tuecl:
    kind: conllu
    url: https://raw.githubusercontent.com/UniversalDependencies/UD_Kyrgyz-TueCL/7420c3d8b74d31ccd09e7c43f8bd5dcc39509949/ky_tuecl-ud-test.conllu
    revision: 7420c3d8b74d31ccd09e7c43f8bd5dcc39509949
    license: CC-BY-SA-4.0
  belebele:
    kind: huggingface
    repo: facebook/belebele
    subset: kir_Cyrl
    split: test
    revision: 7899cdfa4e1e0d733fd77c848e2c273cb1d32be2
    text_fields: [flores_passage, question, mc_answer1, mc_answer2, mc_answer3, mc_answer4]
    license: CC-BY-SA-4.0
  sib200:
    kind: huggingface
    repo: Davlan/sib200
    subset: kir_Cyrl
    split: test
    revision: 38977a667f6fc264d5c26ec57a01e16db040b358
    text_fields: [text]
    license: CC-BY-SA-4.0

