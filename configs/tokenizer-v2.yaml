version: tokenizer-v2

paths:
  kyrgyz_train_glob: data/processed/corpus-v1/train-*.jsonl.zst
  russian_train_glob: data/processed/corpus-ru-v1/train-*.jsonl.zst
  validation_sets:
    kyrgyz-corpus-validation: data/processed/corpus-v1/validation-*.txt.zst
    russian-corpus-validation: data/processed/corpus-ru-v1/validation-*.txt.zst
  working_dir: artifacts/tokenizer-v2
  evaluation_dir: data/evaluation/tokenizer-v2
  release_dir: models/kyrgyz-russian-byte-bpe-v2

training:
  total_bytes: 503316480
  russian_shares: [0.0, 0.1, 0.2, 0.3]
  pretokenizers: [deepseek, gigachat]
  vocab_sizes: [32768, 40960, 50000]
  min_frequency: 2
  iterator_batch_size: 1000
  max_token_length: 64

evaluation:
  embedding_dimensions: [768, 2048, 4096]
  word_pattern: "[\\p{L}\\p{M}]+(?:[-'][\\p{L}\\p{M}]+)*"
  groups:
    kyrgyz-validation: [kyrgyz-corpus-validation]
    russian-validation: [russian-corpus-validation]
    kyrgyz-external: [ud_ktmu, ud_tuecl, belebele_ky, sib200_ky]
    russian-external: [ud_syntagrus, belebele_ru, sib200_ru]
    mixed-validation: [mixed_ky_ru]
    code-diagnostic: [python_tokenize]
  selection:
    baseline_id: kyrgyz-v1-32768
    minimum_kyrgyz_retention: 0.90
    minimum_russian_gain: 1.20

external_datasets:
  ud_ktmu:
    kind: conllu
    url: https://raw.githubusercontent.com/UniversalDependencies/UD_Kyrgyz-KTMU/46aad7546a3797df9f9ccf8c1c23019eab66dbd2/ky_ktmu-ud-test.conllu
