[project]
name = "kyrgyz-tokenizer"
version = "0.1.0"
description = "Reproducible Kyrgyz corpus and tokenizer research"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "datasets>=4.0,<5",
  "datasketch>=1.6,<2",
  "fasttext-numpy2-wheel>=0.9.2,<1",
  "huggingface-hub>=0.34,<2",
  "mwparserfromhell>=0.7,<1",
  "pyyaml>=6,<7",
  "zstandard>=0.23,<1",
]

[project.scripts]
kyrgyz-corpus = "kyrgyz_corpus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyrgyz_corpus"]

[tool.uv]
package = true
