[project]
name = "kyrgyz-tokenizer"
version = "0.2.0"
description = "Reproducible Kyrgyz corpus and Kyrgyz-Russian byte-level BPE research"
readme = "README.md"
authors = [
  { name = "Nikita Nosov" },
]
requires-python = ">=3.12,<3.14"
keywords = ["bpe", "kyrgyz", "nlp", "russian", "tokenizer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "datasets>=4.0,<5",
  "datasketch>=1.6,<2",
  "fasttext-numpy2-wheel>=0.9.2,<1",
  "huggingface-hub>=0.34,<2",
  "mwparserfromhell>=0.7,<1",
  "pyyaml>=6,<7",
  "regex>=2026.7.19",
  "tiktoken>=0.11,<1",
  "tokenizers>=0.22,<1",
  "zstandard>=0.23,<1",
]

[project.scripts]
kyrgyz-corpus = "kyrgyz_corpus.cli:main"
kyrgyz-tokenizer = "kyrgyz_tokenizer.cli:main"

[project.urls]
Repository = "https://github.com/nik1t7n/kyrgyz-tokenizer"
Documentation = "https://github.com/nik1t7n/kyrgyz-tokenizer/tree/main/docs"
Issues = "https://github.com/nik1t7n/kyrgyz-tokenizer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyrgyz_corpus", "src/kyrgyz_tokenizer"]

[tool.uv]
package = true
